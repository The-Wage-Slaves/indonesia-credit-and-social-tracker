name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: credit-tracker/p2p-scraper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript and repository invariants
        run: |
          node --check credit-tracker/p2p-scraper/scraper.mjs
          node --check credit-tracker/p2p-scraper/update_excel.mjs
          node credit-tracker/dashboard/build_credit_html.mjs
          node .github/scripts/validate_repo.mjs
      - name: Install test dependencies
        # stability-monitor/scripts/daily_alert.py 顶层 import requests，
        # 测它的纯函数也会连带加载该模块。其余步骤仍只依赖标准库。
        run: pip install requests
      - name: Validate Python syntax
        run: python -m compileall -q .github/scripts credit-tracker stability-monitor
      - name: Validate cloud publisher cards
        run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Build and validate downloadable dashboard
        run: python scripts/build_dashboard_package.py
      - name: Validate V4 shadow comparison artifacts
        run: |
          python -m unittest discover -s stability-monitor/scripts -p "test_*.py"
          python stability-monitor/scripts/score_v4_shadow.py --check-output
      - name: Validate digital-credit fear monitor
        run: python -m unittest discover -s credit-tracker/sentiment-monitor -p "test_*.py"
      - name: Validate national macro monitor
        run: python -m unittest discover -s credit-tracker/macro-monitor -p "test_*.py"
      - name: Verify Node dependency lock and vulnerabilities
        working-directory: credit-tracker/p2p-scraper
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev
