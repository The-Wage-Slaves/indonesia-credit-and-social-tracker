name: Fetch a source file as an artifact

# 手动工具：让云端 runner 代为下载一个原始数据文件并作为 artifact 传回。
# 用途：本机网络到 BI（www.bi.go.id）被直接断连，而 GitHub runner 通；
# OJK 新门户则相反（屏蔽境外 IP）。这里不写任何分支，只产 artifact，
# 本机用 `gh run download` 取回后离线解析。
# 也用于排查限流：非 2xx 同样把响应头与正文带回（GDELT 429 的 Retry-After 比状态码有用）。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "要下载的文件 URL"
        required: true
        default: "https://www.bi.go.id/SEKI/tabel/TABEL1_4.xls"
      name:
        description: "artifact 名称"
        required: true
        default: "seki-tabel1_4"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        shell: bash
        run: |
          mkdir -p out
          # UA 必须是完整浏览器串：只写 Mozilla/5.0 时 BI 直接 Connection reset（2026-09-22 实测）。
          # 不带 --fail：非 2xx 也保存正文；-D 保存响应头；|| true 让 artifact 一定能上传。
          curl -sSL --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            -e "https://www.bi.go.id/" \
            -D out/headers.txt \
            -w "HTTP %{http_code} in %{time_total}s from %{remote_ip}\n" \
            -o "out/body.bin" "${{ inputs.url }}" || true
          echo "--- headers ---"; cat out/headers.txt || true
          echo "--- body head ---"; head -c 600 out/body.bin || true; echo
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out/
          retention-days: 7
