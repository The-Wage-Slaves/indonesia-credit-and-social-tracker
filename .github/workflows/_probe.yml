# 临时探针：合并前必须删除。分支限定 push 触发（dispatch 要求存在于默认分支）。
name: TEMP probe OJK agg
on:
  push:
    branches: [feat/seki-ojk-datasources]
    paths: ['credit-tracker/probes/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python credit-tracker/probes/probe_ojk_agg.py
