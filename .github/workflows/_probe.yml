# 临时探针：合并前必须删除。
# 用 push 而非 workflow_dispatch，因为 dispatch 要求工作流已存在于默认分支。
# 限定只在本特性分支触发，不影响任何采集工作流（那三个仍是 schedule/dispatch only）。
name: TEMP probe OJK
on:
  push:
    branches: [feat/seki-ojk-datasources]
    paths: ['credit-tracker/probes/**', '.github/workflows/_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe OJK endpoints
        run: python credit-tracker/probes/probe_ojk.py
