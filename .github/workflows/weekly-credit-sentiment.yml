name: Weekly digital-credit sentiment

on:
  schedule:
    - cron: "15 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-credit-sentiment
  cancel-in-progress: false

jobs:
  collect-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sentiment collectors
        run: pip install -r credit-tracker/sentiment-monitor/requirements.txt
      - name: Build pending two-week fear-index review
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python credit-tracker/sentiment-monitor/credit_sentiment.py --write-output
          python -m unittest discover -s credit-tracker/sentiment-monitor -p "test_*.py"
      - name: Read review summary
        id: summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const data = require("./credit-tracker/sentiment-monitor/output/credit-sentiment-pending.json");
          const latest = data.weeks.at(-1);
          console.log(`week_end=${latest.weekEnd}`);
          console.log(`fear_index=${latest.fearIndex}`);
          console.log(`news_score=${latest.engines.news.score ?? "NA"}`);
          console.log(`social_score=${latest.engines.social.score ?? "NA"}`);
          console.log(`data_status=${latest.dataStatus}`);
          console.log(`alert_level=${data.latestAlert.level}`);
          console.log(`active_count=${data.latestAlert.active.length}`);
          NODE
      - name: Add the pending result to the workflow summary
        env:
          WEEK_END: ${{ steps.summary.outputs.week_end }}
          FEAR_INDEX: ${{ steps.summary.outputs.fear_index }}
          NEWS_SCORE: ${{ steps.summary.outputs.news_score }}
          SOCIAL_SCORE: ${{ steps.summary.outputs.social_score }}
          DATA_STATUS: ${{ steps.summary.outputs.data_status }}
          ALERT_LEVEL: ${{ steps.summary.outputs.alert_level }}
        shell: bash
        run: |
          {
            echo "## Digital-credit sentiment pending review"
            echo
            echo "| Week end | Fear index | News | Social | Coverage | Alert |"
            echo "|---|---:|---:|---:|---|---|"
            echo "| ${WEEK_END} | ${FEAR_INDEX} | ${NEWS_SCORE} | ${SOCIAL_SCORE} | ${DATA_STATUS} | ${ALERT_LEVEL} |"
            echo
            echo "This is an unconfirmed observation. It does not update \`main\` or confirmed dashboard history."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish pending review data without a pull request
        env:
          WEEK_END: ${{ steps.summary.outputs.week_end }}
        shell: bash
        run: |
          if git diff --quiet -- credit-tracker/sentiment-monitor/output; then
            echo "No pending-output change."
            exit 0
          fi
          branch="bot/weekly-credit-sentiment"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add credit-tracker/sentiment-monitor/output
          git commit -m "data: prepare digital-credit sentiment review for ${WEEK_END}"
          git push --force-with-lease origin "HEAD:${branch}"
      - name: Create a deduplicated red-alert issue
        if: steps.summary.outputs.alert_level == 'red'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK_END: ${{ steps.summary.outputs.week_end }}
          FEAR_INDEX: ${{ steps.summary.outputs.fear_index }}
          ACTIVE_COUNT: ${{ steps.summary.outputs.active_count }}
        shell: bash
        run: |
          title="[RED] Digital-credit sentiment alert — ${WEEK_END}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "$title" \
              --body "Automated evidence gate passed for ${ACTIVE_COUNT} high-risk event(s). Fear index: **${FEAR_INDEX}**. Review the pending evidence on the \`bot/weekly-credit-sentiment\` branch and its cited primary and independent sources before acting. No confirmed dashboard history has been changed."
          fi
