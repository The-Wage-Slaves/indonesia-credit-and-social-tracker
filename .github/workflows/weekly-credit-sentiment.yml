name: Tuesday weekly monitoring

on:
  schedule:
    # Tuesday 10:15 Asia/Shanghai / 09:15 WIB.
    - cron: "15 2 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tuesday-weekly-monitoring
  cancel-in-progress: false

env:

jobs:
  collect-publish-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install weekly collectors
        run: |
          pip install -r credit-tracker/sentiment-monitor/requirements.txt
          pip install requests
      - name: Prepare ignored runtime configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          cfg = {
              "youtube": {"api_key": os.getenv("YOUTUBE_API_KEY", "")},
              "reddit": {
                  "client_id": os.getenv("REDDIT_CLIENT_ID", ""),
                  "client_secret": os.getenv("REDDIT_CLIENT_SECRET", ""),
                  "user_agent": "github-actions:indonesia-monitor:v1",
              },
              "llm": {
                  "api_key": os.getenv("DEEPSEEK_API_KEY", ""),
                  "base_url": "https://api.deepseek.com",
                  "model": "deepseek-chat",
              },
          }
          pathlib.Path("stability-monitor/scripts/street_heat_config.yaml").write_text(
              yaml.safe_dump(cfg, allow_unicode=True), encoding="utf-8"
          )
          PY
      - name: Build digital-credit fear-index review
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python credit-tracker/sentiment-monitor/credit_sentiment.py --write-output
          python -m unittest discover -s credit-tracker/sentiment-monitor -p "test_*.py"
      - name: Build stability street-heat review
        id: street
        continue-on-error: true
        run: python stability-monitor/scripts/street_heat.py
      - name: Read weekly decision summary
        id: summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const data = require("./credit-tracker/sentiment-monitor/output/credit-sentiment-pending.json");
          const latest = data.weeks.at(-1);
          console.log(`week_end=${latest.weekEnd}`);
          console.log(`fear_index=${latest.fearIndex}`);
          console.log(`news_score=${latest.engines.news.score ?? "NA"}`);
          console.log(`social_score=${latest.engines.social.score ?? "NA"}`);
          console.log(`data_status=${latest.dataStatus}`);
          console.log(`alert_level=${latest.alert.level}`);
          console.log(`active_count=${latest.alert.active.length}`);
          console.log(`candidate_count=${(latest.alert.reviewCandidates || []).length}`);
          console.log(`suppressed_count=${latest.alert.suppressedCandidateCount || 0}`);
          NODE
      - name: Add human-readable summary
        env:
          WEEK_END: ${{ steps.summary.outputs.week_end }}
          FEAR_INDEX: ${{ steps.summary.outputs.fear_index }}
          NEWS_SCORE: ${{ steps.summary.outputs.news_score }}
          SOCIAL_SCORE: ${{ steps.summary.outputs.social_score }}
          DATA_STATUS: ${{ steps.summary.outputs.data_status }}
          ALERT_LEVEL: ${{ steps.summary.outputs.alert_level }}
          ACTIVE_COUNT: ${{ steps.summary.outputs.active_count }}
          CANDIDATE_COUNT: ${{ steps.summary.outputs.candidate_count }}
          SUPPRESSED_COUNT: ${{ steps.summary.outputs.suppressed_count }}
          STREET_STATUS: ${{ steps.street.outcome }}
        shell: bash
        run: |
          {
            echo "## Tuesday monitoring · pending human review"
            echo
            echo "| Week end | Fear index | News | Social | Coverage | Alert | Verified events | Review candidates |"
            echo "|---|---:|---:|---:|---|---|---:|---:|"
            echo "| ${WEEK_END} | ${FEAR_INDEX} | ${NEWS_SCORE} | ${SOCIAL_SCORE} | ${DATA_STATUS} | ${ALERT_LEVEL} | ${ACTIVE_COUNT} | ${CANDIDATE_COUNT} |"
            echo
            echo "- Street-heat collector: **${STREET_STATUS}**"
            echo "- ${SUPPRESSED_COUNT} low-evidence/repeated candidates were folded away and are not high-risk events."
            echo "- No confirmed score or history was changed."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish pending data to private dashboard and notify Feishu on risk
        env:
          STREET_STATUS: ${{ steps.street.outcome }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL || secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET || secrets.FEISHU_SECRET }}
          # 卡片里的印尼语标题要转成中文，靠 cloud_publish.py 的 enrich_zh()。
          # 不传这个 key 不会报错，只会静默退回印尼语原文——务必保留。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 故不传 --publish-dashboard：否则 cloud_publish.py 判定「要求的通道未配置」返回 2，
          # 让整个工作流红灯(2026-07-30 实测)。飞书推送不受影响。
        run: python .github/scripts/cloud_publish.py weekly --push
      - name: Stage pending review data without a pull request
        if: always()
        env:
          WEEK_END: ${{ steps.summary.outputs.week_end }}
        shell: bash
        run: |
          branch="bot/weekly-monitoring"
          transfer_dir="$(mktemp -d)"
          tar -cf "$transfer_dir/pending-output.tar" --ignore-failed-read \
            credit-tracker/sentiment-monitor/output \
            stability-monitor/scripts/output \
            stability-monitor/scripts/street_heat_history.json \
            pending.json pending.js outputs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          tar -xf "$transfer_dir/pending-output.tar"
          git add credit-tracker/sentiment-monitor/output || true
          git add stability-monitor/scripts/output || true
          git add stability-monitor/scripts/street_heat_history.json || true
          git add pending.json pending.js || true
          git add outputs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No pending-output change."
            exit 0
          fi
          git commit -m "data: prepare Tuesday monitoring review for ${WEEK_END:-unknown}"
          git push --force-with-lease origin "HEAD:${branch}"
      - name: Create one deduplicated red-alert issue
        if: always() && steps.summary.outputs.alert_level == 'red'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK_END: ${{ steps.summary.outputs.week_end }}
          FEAR_INDEX: ${{ steps.summary.outputs.fear_index }}
          ACTIVE_COUNT: ${{ steps.summary.outputs.active_count }}
        shell: bash
        run: |
          title="[RED] Digital-credit sentiment alert — ${WEEK_END}"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create \
              --title "$title" \
              --body "Weekly evidence triggered red review. Fear index: **${FEAR_INDEX}**; verified event count: **${ACTIVE_COUNT}**. Open the private dashboard for the capped human-readable evidence list. No confirmed history was changed."
          fi

