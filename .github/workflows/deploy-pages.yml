# Online publication is intentionally disabled because this repository contains
# sensitive competitive and political analysis. Keep this manual guard workflow
# so a push to main can never publish repository contents by accident.
name: Pages deployment disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment policy
        run: |
          echo "GitHub Pages deployment is disabled for this sensitive repository."
          echo "Use the documented local server workflow instead."
