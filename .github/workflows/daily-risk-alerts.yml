name: Daily risk alerts

on:
  schedule:
    # 目标 09:43 Asia/Shanghai（01:43 UTC），留出约 17 分钟缓冲，让常见延迟后
    # 仍落在 10 点附近。**不要改回整点**：cron 定在 :00 时 GitHub 排队最拥堵，
    # 2026-07-31~08-02 实测连续三天延迟 192/192/200 分钟，10:00 的警报 13:12 才到。
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-risk-alerts
  cancel-in-progress: false

jobs:
  detect-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install daily collectors
        run: |
          pip install -r credit-tracker/sentiment-monitor/requirements.txt
          pip install requests
      - name: Prepare ignored runtime configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          cfg = {
              "youtube": {"api_key": os.getenv("YOUTUBE_API_KEY", "")},
              "reddit": {
                  "client_id": os.getenv("REDDIT_CLIENT_ID", ""),
                  "client_secret": os.getenv("REDDIT_CLIENT_SECRET", ""),
                  "user_agent": "github-actions:indonesia-monitor:v1",
              },
              "llm": {
                  "api_key": os.getenv("DEEPSEEK_API_KEY", ""),
                  "base_url": "https://api.deepseek.com",
                  "model": "deepseek-chat",
              },
          }
          pathlib.Path("stability-monitor/scripts/street_heat_config.yaml").write_text(
              yaml.safe_dump(cfg, allow_unicode=True), encoding="utf-8"
          )
          PY
      - name: Detect stability institutional shocks
        id: stability
        continue-on-error: true
        run: python stability-monitor/scripts/daily_alert.py --no-push
      - name: Detect Pinjol/Pindar daily volatility
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # 这里不跑单测。同一套测试 validate.yml 已在每次 PR/push 上跑过，
        # 放在数据工作流里只会让一次测试失败杀掉当天的数据采集与推送——
        # 2026-08-05~08-10 连续 6 天正是这样死的，飞书一条没发。
        run: python credit-tracker/sentiment-monitor/credit_daily_alert.py --write-output
      - name: Publish pending data and notify Feishu only when abnormal
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL || secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET || secrets.FEISHU_SECRET }}
          # 卡片里的印尼语标题要转成中文，靠 cloud_publish.py 的 enrich_zh()。
          # 不传这个 key 不会报错，只会静默退回印尼语原文——务必保留。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STABILITY_STATUS: ${{ steps.stability.outcome }}
          # 故不传 --publish-dashboard：否则 cloud_publish.py 判定「要求的通道未配置」返回 2，
          # 让整个工作流红灯(2026-07-30 实测)。飞书推送不受影响。
        run: python .github/scripts/cloud_publish.py daily --push
      - name: Stage daily evidence without a pull request
        if: always()
        shell: bash
        run: |
          branch="bot/daily-risk-alerts"
          transfer_dir="$(mktemp -d)"
          # 单一清单同时驱动「打包」与「清理」。逐个列举两遍必然漏——
          # 2026-08-11 就漏了 outputs/：它由飞书发布步骤生成，而那一步此前一直被
          # skip，所以直到前两个路径修好、它才第一次暴露出来。
          artifacts="credit-tracker/sentiment-monitor/output/daily-credit-alert-pending.json
            stability-monitor/data/daily-events
            pending.json
            pending.js
            outputs"
          tar -cf "$transfer_dir/pending-output.tar" --ignore-failed-read $artifacts
          # 合并脚本也要先备份出去：bot 分支建自旧 main，上面没有这个文件，
          # 切过去之后脚本就从工作区消失了。
          cp .github/scripts/merge_daily_evidence.py "$transfer_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 产物已装进 tar，切分支前必须全部从工作区移走：bot 分支上已有这些路径，
          # 而工作区里的同名文件是未跟踪的，git 会以「未跟踪文件将被覆盖」中止
          # checkout——2026-08-05~08-11 连续失败都是这个原因。
          for path in $artifacts; do rm -rf "$path"; done
          # 证据池必须累积。从 main 重建分支会让每天的提交只含当天一条，前几天被
          # 整个覆盖——周更第 ⓪ 步规定这个分支是日频事件的单一真源，那样等于每周
          # 丢掉 6 天证据(2026-08-04 发现分支上只剩当天一条)。
          # 所以：优先接续既有 bot 分支，并把本次产物「并入」而不是覆盖。
          git fetch origin "$branch" || true
          if git rev-parse --verify "refs/remotes/origin/$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" "refs/remotes/origin/$branch"
          else
            git checkout -B "$branch" origin/main
          fi
          mkdir -p "$transfer_dir/incoming"
          tar -xf "$transfer_dir/pending-output.tar" -C "$transfer_dir/incoming"
          python "$transfer_dir/merge_daily_evidence.py" "$transfer_dir/incoming"
          git add credit-tracker/sentiment-monitor/output/daily-credit-alert-pending.json || true
          git add stability-monitor/data/daily-events || true
          git add pending.json pending.js || true
          git add outputs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No daily evidence change."
            exit 0
          fi
          git commit -m "data: stage daily risk review $(date -u +%F)"
          git push --force-with-lease origin "HEAD:${branch}"

