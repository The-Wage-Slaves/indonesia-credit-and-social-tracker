name: 印尼简报

on:
  schedule:
    # cron 用 UTC。雅加达 = UTC+7,上海 = UTC+8。
    # 工作日 07:30 雅加达 = 00:30 UTC
    - cron: "30 0 * * 1-5"
    # 周五 17:00 雅加达 = 10:00 UTC(周报)
    - cron: "0 10 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, dry-run, check-feeds]

permissions:
  contents: write   # 需要提交 history.json 的更新

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 判定运行模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flag=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * 5" ]; then
            echo "flag=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "flag=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: 运行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          case "${{ steps.mode.outputs.flag }}" in
            weekly)      python -m src.main --weekly ;;
            dry-run)     python -m src.main --dry-run ;;
            check-feeds) python -m src.main --check-feeds ;;
            *)           python -m src.main ;;
          esac

      - name: 提交 history 更新
        if: steps.mode.outputs.flag == 'weekly'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/history.json
          git diff --staged --quiet || git commit -m "chore: 更新指标序列 [skip ci]"
          git push
