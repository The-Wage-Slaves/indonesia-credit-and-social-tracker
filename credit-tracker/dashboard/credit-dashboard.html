  const exV=[bm,bb,bo,mm,mb,p].filter(v=>v!=null);

// ===== P2P 数据合并层（已确认批次为正式底层；暗门仅保留本机覆盖） =====
const P2P_PENDING_DATA = (typeof P2P_PENDING !== "undefined") ? P2P_PENDING : null;
const P2P_CONFIRMED_DATA = window.P2P_CONFIRMED || {batches:[]};
const P2P_EXTRA_KEY = "ct_p2pExtra";
const loadP2pExtra = () => {
  const confirmed = Array.isArray(P2P_CONFIRMED_DATA.batches) ? P2P_CONFIRMED_DATA.batches : [];
  let local = [];
  try { local = JSON.parse(localStorage.getItem(P2P_EXTRA_KEY) || "[]"); } catch(e) { local = []; }
  return [...confirmed.filter(batch=>!local.some(row=>row.srcDate===batch.srcDate)), ...local];
};
const saveP2pExtra = (v) => localStorage.setItem(P2P_EXTRA_KEY, JSON.stringify(v));
const firstWord = (n) => (n||"").split(/[ (]/)[0].toLowerCase();
const samePlayer = (a,b) => firstWord(a)===firstWord(b) || (/lentera|shopee/i.test(a) && /lentera|shopee/i.test(b));
const buildP2PData = (extras, fx) => {
  const d = JSON.parse(JSON.stringify(p2pRaw));
  const FIELD = { disbursement:"disb", outstanding:"out", totalBorrowers:"tot", activeBorrowers:"act" };
  extras.forEach(ex => {
    for (const [metric, f] of Object.entries(FIELD)) {
      const sec = d[metric];
      if (sec.dates.includes(ex.date)) continue;
      sec.dates.push(ex.date);
      for (const k of Object.keys(sec.players)) {
        const row = ex.rows.find(r => samePlayer(r.name, k));
        sec.players[k].push(row && row[f] != null ? row[f] : null);
      }
    }
  });
  // USD金额按所选汇率折算（底数为FX=15000口径采集换算）
  if (fx && fx !== DEFAULT_FX) {
    const scale = DEFAULT_FX / fx;
    for (const metric of ["disbursement", "outstanding"]) {
      const sec = d[metric];
      for (const k of Object.keys(sec.players))
        sec.players[k] = sec.players[k].map(v => v != null ? +(v * scale).toFixed(3) : null);
    }
  }
  return d;
};

// ===== 通用组件 =====
const tipBox = {background:"#ffffff",borderRadius:8,padding:"10px 14px",border:"1px solid #e7e9ee",boxShadow:"0 4px 12px rgba(16,24,40,.08)",color:"#1f2937",fontSize:11,maxWidth:280};

const CustomTooltip = ({active,payload,label}) => {
  if(!active||!payload) return null;
  return (<div style={tipBox}>
    <div style={{fontWeight:700,marginBottom:4,color:"#111827",fontSize:12}}>{label}</div>
    {payload.filter(p=>p.value!=null).map((p,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",gap:12,marginBottom:1}}>
      <span style={{color:p.color}}>{p.name}</span>
      <span style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{typeof p.value==='number'&&p.value>10000?(p.value/1e6).toFixed(2)+'M':p.value<100?'$'+p.value.toFixed(3)+'B':p.value.toLocaleString()}</span>
    </div>))}
  </div>);
};
const P2PTooltip = ({active,payload,label,unit}) => {
  if(!active||!payload) return null;
  return (<div style={tipBox}>
    <div style={{fontWeight:700,marginBottom:4,color:"#111827",fontSize:12}}>{label}</div>
    {payload.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value).map((p,i)=>(<div key={i} style={{display:"flex",justifyContent:"space-between",gap:12,marginBottom:1}}>
      <span style={{color:p.color}}>{p.name}</span>
      <span style={{fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{unit==='usd'?'$'+p.value.toFixed(3)+'B':unit==='ppl'?(p.value>=1e6?(p.value/1e6).toFixed(2)+'M':p.value>=1e3?(p.value/1e3).toFixed(1)+'K':p.value):p.value}</span>
    </div>))}
  </div>);
};
const MacroTooltip = ({active,payload,label,suffix}) => {
  if(!active||!payload||!payload.length) return null;
  return (<div style={tipBox}>
    <div style={{fontWeight:700,marginBottom:2,color:"#111827",fontSize:12}}>{label}</div>
    <div style={{fontWeight:600}}>{payload[0].value?.toLocaleString()}{suffix||''}</div>
  </div>);
};

function SectionHead({no,title,en,note}) {
  return (<div style={{margin:"36px 0 14px",paddingBottom:8,borderBottom:"2px solid #111827"}}>
    <h2 style={{fontSize:18,fontWeight:700,color:"#111827",margin:0}}>{no} {title} <span style={{fontSize:12,fontWeight:400,color:"#9aa1ab"}}>{en}</span></h2>
    {note && <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>{note}</div>}
  </div>);
}

function MacroChart({title,data,xKey,yKey,color,suffix,domain,refLines}) {
  return (<div style={cardS}>
    <h3 style={h3S}>{title}</h3>
    <ResponsiveContainer width="100%" height={200}>
      <LineChart data={data} margin={{top:5,right:10,bottom:0,left:-10}}>
        <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
        <XAxis dataKey={xKey} tick={{fontSize:9,fill:"#6b7280"}} />
        <YAxis tick={{fontSize:9,fill:"#6b7280"}} domain={domain||["auto","auto"]} />
        <Tooltip content={<MacroTooltip suffix={suffix} />} />
        {(refLines||[]).map((r,i)=>(<ReferenceLine key={i} y={r.y} stroke={r.color||"#d1d5db"} strokeDasharray="4 4" label={{value:r.label,fontSize:9,fill:"#9aa1ab",position:"insideTopRight"}} />))}
        <Line type="monotone" dataKey={yKey} stroke={color} strokeWidth={2} dot={{r:2.5,fill:color}} connectNulls />
      </LineChart>
    </ResponsiveContainer>
  </div>);
}

function PlayersChart({metric,title,unit,data}) {
  const section = data[metric];
  if(!section) return null;
  const dates = section.dates;
  const players = section.players;
  const activeNames = Object.keys(players).filter(n => players[n].filter(v=>v!=null).length >= 2); // ≥2期即上图(AdaPundi/KrediOne等新增玩家期数少)
  const chartRows = dates.map((d,i) => {
    const row = {date: d.length>7?d.substring(0,7):d};
    activeNames.forEach(n => { row[shortName(n)] = players[n][i]; });
    return row;
  });
  return (<div style={{...cardS,marginBottom:12}}>
    <h3 style={h3S}>{title}</h3>
    <ResponsiveContainer width="100%" height={280}>
      <LineChart data={chartRows}>
        <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
        <XAxis dataKey="date" tick={{fontSize:9,fill:"#6b7280"}} angle={-45} textAnchor="end" height={45} />
        <YAxis tick={{fontSize:9,fill:"#6b7280"}} />
        <Tooltip content={<P2PTooltip unit={unit} />} />
        <Legend wrapperStyle={{fontSize:10}} />
        {activeNames.map(n=>(<Line key={n} type="monotone" dataKey={shortName(n)} stroke={getColor(n)} strokeWidth={1.5} dot={false} connectNulls />))}
      </LineChart>
    </ResponsiveContainer>
  </div>);
}

function LatestSnapshot({data}) {
  const rows = [];
  const section = data.disbursement;
  const allNames = Object.keys(section.players);
  const lastIdx = section.dates.length - 1;
  allNames.forEach(name => {
    const disb = data.disbursement.players[name]?.[lastIdx];
    const nm2 = Object.keys(data.outstanding.players).find(k=>k.includes(name.split(' ')[0])||name.includes(k.split(' ')[0]));
    const outst = nm2 ? data.outstanding.players[nm2]?.[lastIdx] : null;
    const nm3 = Object.keys(data.totalBorrowers.players).find(k=>k.includes(name.split(' ')[0])||name.includes(k.split(' ')[0]));
    const tb = nm3 ? data.totalBorrowers.players[nm3]?.[data.totalBorrowers.dates.length-1] : null;
    const nm4 = Object.keys(data.activeBorrowers.players).find(k=>k.includes(name.split(' ')[0])||name.includes(k.split(' ')[0]));
    const ab = nm4 ? data.activeBorrowers.players[nm4]?.[data.activeBorrowers.dates.length-1] : null;
    rows.push({name:shortName(name),disb,outst,tb,ab,color:getColor(name)});
  });
  return (<div style={{...cardS,marginBottom:12}}>
    <h3 style={h3S}>最新快照 (as of {section.dates[lastIdx]})</h3>
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:10,whiteSpace:"nowrap"}}>
        <thead><tr style={{borderBottom:"2px solid #e7e9ee"}}>
          {["Player","YTD Disb ($B)","Outstanding ($B)","Total Borrowers","Active Borrowers"].map((h,i)=>(
            <th key={i} style={{textAlign:i===0?"left":"right",padding:"5px 6px",color:"#6b7280",fontWeight:600,fontSize:9}}>{h}</th>))}
        </tr></thead>
        <tbody>{rows.filter(r=>r.disb!=null||r.outst!=null).sort((a,b)=>(b.disb||0)-(a.disb||0)).map((r,i)=>(
          <tr key={i} style={{borderBottom:"1px solid #f1f2f4"}}>
            <td style={{padding:"4px 6px",color:r.color,fontWeight:600}}>{r.name}</td>
            <td style={{padding:"4px 6px",textAlign:"right",fontFamily:"monospace",fontSize:10,color:"#1f2937"}}>{r.disb!=null?'$'+r.disb.toFixed(3)+'B':'—'}</td>
            <td style={{padding:"4px 6px",textAlign:"right",fontFamily:"monospace",fontSize:10,color:"#1f2937"}}>{r.outst!=null?'$'+r.outst.toFixed(3)+'B':'—'}</td>
            <td style={{padding:"4px 6px",textAlign:"right",fontFamily:"monospace",fontSize:10,color:"#1f2937"}}>{r.tb!=null?(r.tb>=1e6?(r.tb/1e6).toFixed(2)+'M':r.tb.toLocaleString()):'—'}</td>
            <td style={{padding:"4px 6px",textAlign:"right",fontFamily:"monospace",fontSize:10,color:"#1f2937"}}>{r.ab!=null?(r.ab>=1e6?(r.ab/1e6).toFixed(2)+'M':r.ab>=1e3?(r.ab/1e3).toFixed(1)+'K':r.ab):'—'}</td>
          </tr>))}</tbody>
      </table>
    </div>
  </div>);
}

const FIELD_DEFS = [
  ["bankVeh","Bank 车贷","BI SSKI Tabel17 · R35"],
  ["bankMP","Bank 多用途","BI SSKI Tabel17 · R36"],
  ["bankBNPL","Bank BNPL","RDKB 月度新闻稿"],
  ["bankOth","Bank 其他","BI SSKI Tabel17 · R38"],
  ["mf2W","MF 二轮","OJK PP9 · R37-43合计"],
  ["mf4W","MF 四轮","OJK PP9 · R45-51合计"],
  ["mfMP","MF 多用途","OJK PP9 · R64-69合计"],
  ["mfBNPL","MF BNPL","RDKB 月度新闻稿"],
  ["p2p","P2P Outstanding","OJK LPBBTI Sheet9 · R4+R11"],
];

function ManualDataPanel({extra,onChange}) {
  const [period,setPeriod] = useState("");
  const [vals,setVals] = useState({});
  const [msg,setMsg] = useState("");
  const inpS = {width:"100%",boxSizing:"border-box",padding:"6px 8px",border:"1px solid #d1d5db",borderRadius:6,fontSize:12,fontFamily:"monospace"};
  const save = () => {
    if(!/^20\d{2}\.(0[1-9]|1[0-2])$/.test(period)){ setMsg("⚠ 月份格式应为 YYYY.MM，例如 2026.01"); return; }
    const row = {period};
    let filled = 0, invalid = 0;
    FIELD_DEFS.forEach(([k])=>{
      const text = String(vals[k] ?? "").trim();
      const v = text === "" ? null : parseNonNegativeNumber(text);
      if(text !== "" && v === null) invalid++;
      row[k] = v;
      if(v !== null) filled++;
    });
    if(invalid){ setMsg("⚠ 数值必须是非负有限数字，不能含单位或其他字符"); return; }
    if(filled===0){ setMsg("⚠ 至少填一个数值"); return; }
    onChange([...extra.filter(e=>e.period!==period), row]);
    setMsg(`✓ 已保存 ${period}（填了${filled}项），图表已更新`); setPeriod(""); setVals({});
  };
  const copyJSON = () => {
    const txt = JSON.stringify(extra,null,2);
    if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>setMsg("✓ 已复制到剪贴板——发给 Claude Code 说\"固化手工月度数据\"即可写进文件")); }
    else { window.prompt("手动复制以下内容：", txt); }
  };
  return (<div style={{...cardS,border:"1.5px solid #bfdbfe",background:"#f8fbff",marginTop:14}}>
    <h3 style={{...h3S,color:"#1e40af"}}>✎ 数据管理 · 手工录入新月份（暗门）</h3>
    <div style={{fontSize:11,color:"#4b5563",lineHeight:1.8,marginBottom:12}}>
      <b>怎么用：</b>每月OJK/BI出新数后，把下面几个数从源文件里抄进来，单位一律 <b>Rp Miliar</b>（十亿盾，与主追踪表一致），USD图表自动按FX=15,000换算。没有的项留空。<br/>
      <b>源文件在哪：</b>
      <a href="https://www.bi.go.id/id/statistik/ekonomi-keuangan/sski/Documents/Tabel_17.xls" target="_blank" style={{color:"#2563eb"}}>BI SSKI Tabel 17 直接下载</a> ·
      <a href="https://www.ojk.go.id/id/kanal/iknb/data-dan-statistik/lembaga-pembiayaan/default.aspx" target="_blank" style={{color:"#2563eb"}}>OJK 多元金融</a> ·
      <a href="https://www.ojk.go.id/id/kanal/iknb/data-dan-statistik/fintech/default.aspx" target="_blank" style={{color:"#2563eb"}}>OJK LPBBTI</a>
      （OJK 2026年起迁移至 data.ojk.go.id/SJKPublic，旧页停在2025.12）<br/>
      <b>注意：</b>这里录的数存在<b>当前浏览器</b>里（清缓存/换浏览器会丢）。录完点"复制JSON"发给 Claude Code 说"固化手工月度数据"，就永久写进文件。
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginBottom:10}}>
      <div>
        <div style={{fontSize:10,color:"#6b7280",marginBottom:3}}>月份 (YYYY.MM) <b style={{color:"#dc2626"}}>*</b></div>
        <input style={inpS} placeholder="2026.01" value={period} onChange={e=>setPeriod(e.target.value.trim())} />
      </div>
      {FIELD_DEFS.map(([k,label,src])=>(<div key={k}>
        <div style={{fontSize:10,color:"#6b7280",marginBottom:3}} title={src}>{label} <span style={{color:"#c3c8cf"}}>({src})</span></div>
        <input style={inpS} placeholder="Rp Miliar" value={vals[k]||""} onChange={e=>setVals({...vals,[k]:e.target.value.trim()})} />
      </div>))}
    </div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
      <button onClick={save} style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:"#2563eb",color:"#fff"}}>保存本月</button>
      <button onClick={copyJSON} disabled={!extra.length} style={{padding:"7px 16px",borderRadius:8,border:"1px solid #d1d5db",cursor:"pointer",fontSize:12,background:"#fff",color:"#4b5563"}}>复制JSON（固化用）</button>
      <span style={{fontSize:11,color:"#15803d"}}>{msg}</span>
    </div>
    {extra.length>0 && (<div style={{marginTop:12,fontSize:11}}>
      <b style={{color:"#4b5563"}}>已录入 {extra.length} 个月份：</b>
      {extra.map(e=>(<span key={e.period} style={{display:"inline-flex",alignItems:"center",gap:4,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"2px 8px",margin:"2px 4px",color:"#1e40af"}}>
        ✎ {e.period}
        <span onClick={()=>onChange(extra.filter(x=>x.period!==e.period))} style={{cursor:"pointer",color:"#dc2626",fontWeight:700}} title="删除">×</span>
      </span>))}
    </div>)}
  </div>);
}

// ===== 汇率面板（暗门内） =====
function FxPanel({fx,onChange}) {
  const [val,setVal] = useState(String(fx));
  const [msg,setMsg] = useState("");
  const apply = () => {
    const v = parseNonNegativeNumber(val);
    if(v===null||v<8000||v>25000){ setMsg("⚠ 请输入 8,000–25,000 之间的数值"); return; }
    onChange(v); setMsg(`✓ 已切换为 FX=${v.toLocaleString()}，全站USD图表已重算`);
  };
  const reset = () => { setVal(String(DEFAULT_FX)); onChange(DEFAULT_FX); setMsg("✓ 已恢复默认 15,000"); };
  return (<div style={{...cardS,marginTop:14,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
    <b style={{fontSize:13,color:"#111827"}}>💱 汇率 USD/IDR</b>
    <input style={{width:110,padding:"6px 8px",border:"1px solid #d1d5db",borderRadius:6,fontSize:12,fontFamily:"monospace"}}
      value={val} onChange={e=>setVal(e.target.value.trim())} />
    <button onClick={apply} style={{padding:"6px 14px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:"#2563eb",color:"#fff"}}>应用</button>
    {fx!==DEFAULT_FX && <button onClick={reset} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #d1d5db",cursor:"pointer",fontSize:12,background:"#fff",color:"#4b5563"}}>恢复默认15,000</button>}
    <span style={{fontSize:11,color:"#15803d"}}>{msg}</span>
    <div style={{flexBasis:"100%",fontSize:10,color:"#9aa1ab",lineHeight:1.6}}>
      改动仅影响 USD 换算呈现（②行业按Rp原值重算；③竞对底数为FX=15,000口径采集，按比例折算），存于当前浏览器。默认15,000为历史可比口径。
    </div>
  </div>);
}

// ===== P2P 待确认面板（暗门内，scraper抓取数据的结构化确认/修改入口） =====
function P2PPendingPanel({p2pExtra,onChange}) {
  const pend = P2P_PENDING_DATA;
  const pendDate = pend ? pend.date.replace(/-0?/g,".").replace(/^(\d{4})\./,"$1.") : null; // 2026-07-17 → 2026.7.17
  const applied = pend && p2pExtra.some(e=>e.srcDate===pend.date);
  const committed = pend && (P2P_CONFIRMED_DATA.batches||[]).some(e=>e.srcDate===pend.date);
  // 全部平台都显示——抓到的预填，没抓到的留空行供手工补录
  const initRows = () => (pend?.players||[])
    .map(p=>({name:p.name, dataDate:p.dataDate, note:p.note,
      disb:p.disb!=null?String(p.disb):"", out:p.out!=null?String(p.out):"",
      tot:p.tot!=null?String(p.tot):"", act:p.act!=null?String(p.act):""}));
  const [rows,setRows] = useState(initRows);
  const [msg,setMsg] = useState("");
  if(!pend) return null;
  const inp = {width:"100%",boxSizing:"border-box",padding:"4px 6px",border:"1px solid #d1d5db",borderRadius:5,fontSize:11,fontFamily:"monospace"};
  const setCell = (i,f,v) => { const r=[...rows]; r[i]={...r[i],[f]:v.trim()}; setRows(r); };
  // 看板最后值(灰色对照)
  const lastOf = (name,metric,field) => {
    const sec=p2pRaw[metric]; const k=Object.keys(sec.players).find(k=>samePlayer(name,k));
    if(!k) return null; const nz=sec.players[k].map((v,i)=>[sec.dates[i],v]).filter(([,v])=>v!=null);
    return nz.length?nz[nz.length-1]:null;
  };
  const fmt = (v,ppl) => v==null?"—":(ppl?(v>=1e6?(v/1e6).toFixed(2)+"M":Math.round(v).toLocaleString()):"$"+(+v).toFixed(3)+"B");
  const apply = () => {
    let invalid = false;
    const parseCell = (value) => {
      const text = String(value ?? "").trim();
      if(text === "") return null;
      const parsed = parseNonNegativeNumber(text);
      if(parsed === null) invalid = true;
      return parsed;
    };
    const exRows = rows.map(r=>({name:r.name,
      disb:parseCell(r.disb), out:parseCell(r.out),
      tot:parseCell(r.tot), act:parseCell(r.act)}))
      .filter(r=>[r.disb,r.out,r.tot,r.act].some(v=>v!=null));
    if(invalid){ setMsg("⚠ 数值必须是非负有限数字，不能含单位或其他字符"); return; }
    if(!exRows.length){ setMsg("⚠ 没有可写入的数值"); return; }
    const ex = {date:pendDate, srcDate:pend.date, rows:exRows};
    onChange([...p2pExtra.filter(e=>e.srcDate!==pend.date), ex]);
    setMsg(`✓ 已写入 ${pendDate} 数据列（${exRows.length}家），③板块图表已更新`);
  };
  const revert = () => { onChange(p2pExtra.filter(e=>e.srcDate!==pend.date)); setMsg("已撤销本批写入"); };
  const copyJSON = () => {
    const txt = JSON.stringify(p2pExtra,null,2);
    if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>setMsg("✓ 已复制——发给 Claude Code 说\"固化P2P数据\"即可永久写进文件")); }
    else { window.prompt("手动复制：", txt); }
  };
  const th = {textAlign:"right",padding:"4px 6px",color:"#6b7280",fontWeight:600,fontSize:10,whiteSpace:"nowrap"};
  return (<div style={{...cardS,border:"1.5px solid #fcd34d",background:"#fffdf5",marginTop:14}}>
    <h3 style={{...h3S,color:committed?"#166534":"#92400e"}}>{committed?"✓":"🔔"} P2P 竞对抓取数据 · {committed?"已正式确认":"待确认"}（{pend.date} 抓取，{rows.length} 家）</h3>
    {applied ? (<div style={{fontSize:12,color:"#15803d"}}>
      ✓ 本批已写入看板（数据列 {pendDate}）。{!committed&&<span onClick={revert} style={{color:"#dc2626",cursor:"pointer",fontWeight:600,marginLeft:8}}>撤销本批</span>}
      {committed&&<span style={{marginLeft:8}}>M1–M9 于 2026-07-30 人工确认；所有查看者均可见。</span>}
      <button onClick={copyJSON} style={{marginLeft:12,padding:"4px 12px",borderRadius:6,border:"1px solid #d1d5db",cursor:"pointer",fontSize:11,background:"#fff",color:"#4b5563"}}>复制JSON（固化用）</button>
      <span style={{fontSize:11,color:"#15803d",marginLeft:8}}>{msg}</span>
    </div>) : (<div>
      <div style={{fontSize:11,color:"#78716c",lineHeight:1.7,marginBottom:10}}>
        每格都可以直接改；留空=该项不写入。灰色小字是看板当前最后值（用于核对合理性）。
        单位：放款/余额为 <b>USD Bn</b>，借款人为<b>人数</b>。点"确认写入"后存入浏览器并立即上图（可撤销）；要永久固化，写入后点"复制JSON"发给 Claude Code。
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,whiteSpace:"nowrap"}}>
          <thead><tr style={{borderBottom:"2px solid #e7e9ee"}}>
            <th style={{...th,textAlign:"left"}}>Player（官网数据日期）</th>
            <th style={th}>YTD放款 $B</th><th style={th}>Outstanding $B</th>
            <th style={th}>累计借款人</th><th style={th}>当年/活跃借款人</th>
          </tr></thead>
          <tbody>{rows.map((r,i)=>(<tr key={r.name} style={{borderBottom:"1px solid #f1f2f4"}}>
            <td style={{padding:"5px 6px",color:getColor(r.name),fontWeight:600}}>
              {shortName(r.name)}<span style={{color:"#c3c8cf",fontWeight:400,fontSize:10}}> {r.dataDate?`(${r.dataDate})`:""}</span>
              {r.note && <div style={{color:"#b45309",fontWeight:400,fontSize:10}}>⚠ {r.note}</div>}
            </td>
            {["disb","out","tot","act"].map((f,j)=>(<td key={f} style={{padding:"4px 6px",minWidth:110}}>
              <input style={inp} value={r[f]} onChange={e=>setCell(i,f,e.target.value)} placeholder="—" />
              <div style={{fontSize:9,color:"#c3c8cf",textAlign:"right"}}>
                前值 {(() => { const lv=lastOf(r.name,["disbursement","outstanding","totalBorrowers","activeBorrowers"][j],f); return lv?`${fmt(lv[1],j>=2)} @${lv[0]}`:"—"; })()}
              </div>
            </td>))}
          </tr>))}</tbody>
        </table>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",marginTop:10}}>
        <button onClick={apply} style={{padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:"#d97706",color:"#fff"}}>确认写入看板（{pendDate}列）</button>
        <span style={{fontSize:11,color:"#15803d"}}>{msg}</span>
      </div>
    </div>)}
  </div>);
}

// ===== APP =====

    <div style={{fontFamily:"'DM Sans','Noto Sans SC',system-ui,sans-serif",background:"#f7f8fa",minHeight:"100vh",color:"#1f2937"}}>

      <div style={{position:"sticky",top:0,zIndex:50,background:"rgba(255,255,255,0.92)",backdropFilter:"blur(8px)",borderBottom:"1px solid #e7e9ee"}}>

          <a href="#sec1" style={navA}>① 宏观</a>
          <a href="#sec2" style={navA}>② 行业</a>
          <a href="#sec3" style={navA}>③ 竞对</a>
          <a href="#sec4" style={navA}>④ 舆情</a>

        </div>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"8px 14px 40px"}}>
        <MacroSection />
        <IndustrySection chartData={chartData} fx={fx} />
        <PlayersSection p2pData={p2pData} />
        <SentimentSection />
        {showMgr && <FxPanel fx={fx} onChange={v=>{saveFx(v);setFx(v);}} />}
        {showMgr && <P2PPendingPanel p2pExtra={p2pExtra} onChange={v=>{saveP2pExtra(v);setP2pExtra(v);}} />}
        {showMgr && <ManualDataPanel extra={extra} onChange={rows=>{saveExtra(rows);setExtra(rows);}} />}
        <div style={{margin:"28px 0 0",paddingTop:14,borderTop:"1px solid #e7e9ee",textAlign:"center",fontSize:9,color:"#9aa1ab"}}>
          ★ Sep-Dec 2025 newly added · ✎ 手工录入 · Data version {DASHBOARD_DATA_AS_OF}
          <span onClick={()=>setShowMgr(!showMgr)} style={{cursor:"pointer",marginLeft:10,fontWeight:p2pPendingCount?700:400,color:showMgr?"#2563eb":(p2pPendingCount?"#d97706":"#c3c8cf")}} title="手工录入/确认抓取数据">
            ✎ 数据管理{p2pPendingCount?` (${p2pPendingCount}批待确认)`:""}
          </span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
