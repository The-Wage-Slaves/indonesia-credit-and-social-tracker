# Copy to credit_sentiment_config.yaml for local runs. The real file is ignored.
# Values are merged with stability-monitor/scripts/street_heat_config.yaml,
# so blank local fields do not hide an existing shared YouTube/Reddit/DeepSeek key.

youtube:
  api_key: ""

reddit:
  client_id: ""
  client_secret: ""

x:
  # Optional official X API v2 bearer token. No unofficial scraping is used.
  bearer_token: ""

llm:
  # Optional DeepSeek batch classification for public social posts. If absent or
  # if the call fails, the deterministic Indonesian lexicon remains the fallback.
  # In GitHub Actions use the DEEPSEEK_API_KEY repository secret.
  api_key: ""
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
